<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>OpenAI API Chat</title>
  <link rel="stylesheet" href="../css/springai.css" type="text/css">
</head>
<body>
<h2 align="center">OpenAI API 웹 채팅</h2>

<div id="chatBox"></div>

<div id="inputBox">
  <input id="userInput"
         type="text"
         placeholder="메시지를 입력하세요"
         onkeydown="handleChatKeyDown(event)"
  <button onclick="sendMessage()">메시지 전송</button>
</div>

<script>
  async function sendMessage() {
    const input = document.getElementById("userInput");
    const message = input.value.trim();

    if (message === "") {
      return;
    }

    addMessage("Questioner", message);
    input.value = "";

    const response = await fetch("/aichat/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: "message=" + encodeURIComponent(message)
    });

    const aiText = await response.text();
    addMessage("AI Model", aiText);
  }

  function addMessage(sender, text) {
    const chatBox = document.getElementById("chatBox");
    const p = document.createElement("p");

    p.innerHTML = "<b>" + sender + ":</b> " + text;

    chatBox.appendChild(p);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function handleChatKeyDown(event) {
    if (event.isComposing || event.keyCode === 229) {
      return;
    }

    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }
  }
</script>
</body>
</html>
